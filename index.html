<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Snapchat</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fffc00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 550px;
            height: 650px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
            display: flex;
            flex-direction: column;
        }

        /* CABEÇALHO */
        .chat-header {
            background: #fffc00;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 27px;
        }

        .header-info h2 {
            font-size: 19px;
            color: black;
        }

        .header-info p {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }

        /* ÁREA DAS MENSAGENS */
        #mensagens {
            flex: 1;
            list-style: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            background: #fafafa;
        }

        /* MENSAGENS */
        #mensagens li {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        /* MENSAGEM ENVIADA */
        #mensagens li.enviada {
            align-self: flex-end;
            background: #fffc00;
            color: black;
            border-bottom-right-radius: 3px;
        }

        /* MENSAGEM RECEBIDA */
        #mensagens li.recebida {
            align-self: flex-start;
            background: #e9e9e9;
            color: black;
            border-bottom-left-radius: 3px;
        }

        /* AVISO DE ENTRADA */
        #mensagens li.aviso {
            align-self: center;
            background: #eeeeee;
            color: #777777;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
        }

        /* FORMULÁRIO */
        form {
            display: flex;
            gap: 8px;
            padding: 15px;
            background: white;
            border-top: 1px solid #eeeeee;
        }

        /* CAMPOS DE TEXTO */
        input {
            min-width: 0;
            padding: 13px;
            border: 1px solid #dddddd;
            border-radius: 12px;
            outline: none;
            font-size: 13px;
            background: #f8f8f8;
        }

        #nome {
            width: 28%;
        }

        #mensagem {
            flex: 1;
        }

        input:focus {
            border-color: #e5df00;
            background: white;
        }

        input:disabled {
            background: #eeeeee;
            color: #777;
        }

        /* BOTÃO ENVIAR */
        button {
            background: black;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #333333;
            transform: scale(1.04);
        }

        /* BARRA DE ROLAGEM */
        #mensagens::-webkit-scrollbar {
            width: 5px;
        }

        #mensagens::-webkit-scrollbar-thumb {
            background: #dddddd;
            border-radius: 10px;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 500px) {
            .chat-container {
                height: 90vh;
            }

            form {
                gap: 5px;
                padding: 10px;
            }

            input {
                padding: 10px 8px;
                font-size: 11px;
            }

            button {
                padding: 0 12px;
                font-size: 12px;
            }
        }

    </style>
</head>

<body>

    <div class="chat-container">

        <!-- CABEÇALHO -->
        <div class="chat-header">

            <div class="logo">👻</div>

            <div class="header-info">
                <h2>Snapchat Chat</h2>
                <p>Converse com seus amigos!</p>
            </div>

        </div>

        <!-- ÁREA DAS MENSAGENS -->
        <ul id="mensagens"></ul>

        <!-- FORMULÁRIO -->
        <form action="">

            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
                autocomplete="off"
                required
            >

            <input
                type="text"
                id="mensagem"
                placeholder="Digite sua mensagem"
                autocomplete="off"
                required
            >

            <button type="submit">Enviar</button>

        </form>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        // Cria uma instância do Socket.IO
        const socket = io();

        // Seleciona os elementos
        const nomeInput = document.getElementById('nome');
        const mensagemInput = document.getElementById('mensagem');
        const mensagens = document.getElementById('mensagens');

        // Evento para envio do formulário
        document.querySelector('form').addEventListener('submit', event => {

            event.preventDefault();

            const nome = nomeInput.value;
            const mensagem = mensagemInput.value;

            // Verifica se os campos foram preenchidos
            if (nome.trim() && mensagem.trim()) {

                // Avisa aos outros usuários que alguém entrou
                if (!nomeInput.disabled) {
                    socket.emit('usuario entrou', nome.trim());
                }

                // Envia a mensagem para o servidor
                socket.emit('chat message', {
                    nome: nome.trim(),
                    mensagem: mensagem.trim()
                });

                // Limpa o campo de mensagem
                mensagemInput.value = '';

                // Desabilita o campo de nome
                nomeInput.disabled = true;

            }

        });

        // Recebe a notificação de entrada de um usuário
        socket.on('usuario entrou', nome => {

            const aviso = document.createElement('li');

            aviso.textContent = `${nome} entrou no chat 👻`;

            aviso.classList.add('aviso');

            mensagens.appendChild(aviso);

            mensagens.scrollTop = mensagens.scrollHeight;

        });

        // Recebe as mensagens do servidor
        socket.on('chat message', dados => {

            const lista = document.createElement('li');

            lista.textContent = `${dados.nome}: ${dados.mensagem}`;

            // Identifica se a mensagem é do próprio usuário
            if (dados.nome === nomeInput.value.trim()) {
                lista.classList.add('enviada');
            } else {
                lista.classList.add('recebida');
            }

            // Adiciona a mensagem na tela
            mensagens.appendChild(lista);

            // Desce automaticamente para a última mensagem
            mensagens.scrollTop = mensagens.scrollHeight;

        });

    </script>

</body>
</html>
